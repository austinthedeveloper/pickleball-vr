[preset.0]

name="Quest"
platform="Android"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="data/*.json, coach/*"
exclude_filter="tests/*, tools/*"
export_path="../build/pickleball-vr.apk"

[preset.0.options]

gradle_build/use_gradle_build=true
gradle_build/min_sdk="32"
gradle_build/target_sdk="34"
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
package/unique_name="com.tinychair.pickleball94vr"
package/name="Pickleball '94 VR"
package/signed=true
version/code=400
version/name="0.4.0"
xr_features/xr_mode=1
xr_features/enable_meta_plugin=true
meta_xr_features/quest_2_support=true
meta_xr_features/quest_3_support=true
meta_xr_features/quest_pro_support=true
meta_xr_features/hand_tracking=0
meta_xr_features/passthrough=1
screen/immersive_mode=true
permissions/internet=true

[preset.1]

name="macOS"
platform="macOS"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="data/*.json, coach/*"
exclude_filter="tests/*, tools/*"
export_path="../build/Pickleball94VR.zip"

[preset.1.options]

application/bundle_identifier="com.tinychair.pickleball94vr"
binary_format/architecture="universal"
